{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Upload-MP3</title>
    <link rel="stylesheet" href="{% static 'css/load-track.css' %}?=v5">
</head>
<body>
    <div id="loader">
        <div id="main-text">
            <span>MetaTune</span>
            <img src="{% static 'icon.svg' %}" alt="icon">
        </div>
        <label for="input-file" id="upload-block">
            <input type="file" name="input-file" id="input-file" accept=".mp3,.wav" hidden>

            <span id="file">
                <img src="{% static 'file.svg' %}" alt="file">
                <span>Перетащите MP3-файл сюда</span>
            </span>
        </label>

        <div id="player-block" class="hidden">
            <div id="track-info">
                <span id="track-name">Название трека</span>
                <button type="button" id="cancel"><img src="{% static 'cancel.svg' %}" alt="cancel"></button>
            </div>

            <audio id="audio"></audio>

            <div id="player-controls">
                <button type="button" id="play"><img src="{% static 'play.svg' %}" alt="cancel" ></button>

                <div class="slider-container" id="slider">
                    <div class="slider-progress" id="progress"></div>
                    <div class="slider-thumb-glass" id="thumb">
                      <div class="slider-thumb-glass-filter"></div>
                      <div class="slider-thumb-glass-overlay"></div>
                      <div class="slider-thumb-glass-specular"></div>
                    </div>
                </div>
                
                <svg width="0" height="0">
                <filter id="mini-liquid-lens" x="-50%" y="-50%" width="200%" height="200%">
                  <feImage x="0" y="0" result="normalMap" href="data:image/svg+xml;utf8,
                  <svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>
                    <radialGradient id='invmap' cx='50%' cy='50%' r='75%'>
                      <stop offset='0%' stop-color='rgb(128,128,255)'/>
                      <stop offset='90%' stop-color='rgb(255,255,255)'/>
                    </radialGradient>
                    <rect width='100%' height='100%' fill='url(#invmap)'/>
                  </svg>"></feImage>
                  <feDisplacementMap in="SourceGraphic" in2="normalMap" scale="-252" xChannelSelector="R" yChannelSelector="G"
                    result="displaced"></feDisplacementMap>
                  <feMerge>
                    <feMergeNode in="displaced"></feMergeNode>
                  </feMerge>
                </filter>
                </svg>
                
                <span id="time">0:00</span>
            </div>
        </div>

        <button type="submit" id="continue">Продолжить<img src="{% static 'continue.svg' %}" alt="continue"></button>
    </div>

</body>
</html>
