{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Upload-MP3</title>
    <link rel="stylesheet" href="{% static 'css/load-track.css' %}?=v6">
</head>
<body>
    <div id="loader">
        <div id="main-text">
            <span>MetaTune</span>
            <img src="{% static 'icon.svg' %}" alt="icon">
        </div>
        <label for="input-file" id="upload-block">
            <input type="file" name="input-file" id="input-file" accept=".mp3,.wav" hidden>

            <span id="file">
                <img src="{% static 'file.svg' %}" alt="file">
                <span>Перетащите MP3-файл сюда</span>
            </span>
        </label>

        <div id="player-block" class="hidden">
            <div id="track-info">
                <span id="track-name">Название трека</span>
                <button type="button" id="cancel"><img src="{% static 'cancel.svg' %}" alt="cancel"></button>
            </div>
        
            <audio id="audio"></audio>
        
            <div id="player-controls">
                <button type="button" id="play"><img src="{% static 'play.svg' %}" alt="play"></button>
        
                <div class="slider-container" id="slider">
                    <div class="slider-progress" id="progress"></div>
                    <div class="slider-thumb-glass" id="thumb"></div>
                </div>
                
                <span id="time">0:00</span>
            </div>
        </div>

        <button type="submit" id="continue">Продолжить<img src="{% static 'continue.svg' %}" alt="continue"></button>
    </div>

    <script src="{% static 'js/load-track.js' %}"></script>
</body>
</html>
